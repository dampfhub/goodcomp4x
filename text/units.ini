# Its stats, each a label and a value.
[unit_stat_hp]
text = HP

[unit_stat_attack]
text = ATTACK

[unit_stat_defense]
text = DEFENSE

[unit_stat_range]
text = RANGE

[unit_stat_move]
text = MOVE

[unit_interior_hp]
