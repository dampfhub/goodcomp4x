# --- A unit's orders (src/game/ui/trays.rs, src/game/ui/tooltips.rs) ---
# Each order's button: its label, and its tooltip's description. A tooltip's
# title line names the key or click that gives the order (*_keys).

[unit_move]
text = MOVE
tooltip = CLICK A GREEN HEX. SHIFT-CLICK QUEUES LATER TURNS.

[unit_move_keys]
text = {key} OR CLICK

[unit_attack]
text = ATTACK
tooltip = CLICK A HEX IN RANGE OF WHERE IT ENDS ITS MOVE.

# The button's hint, and its tooltip's.
[unit_attack_hint]
text = {key} · RMB

[unit_attack_keys]
text = {key} OR RIGHT-CLICK

[unit_swap]
text = SWAP
tooltip = CLICK AN ADJACENT ALLY.

[unit_swap_hint]
text = CTRL

[unit_swap_keys]
text = CTRL-CLICK

[unit_found_city]
text = FOUND CITY
tooltip = HERE: OPEN LAND, NOT RUINS, {distance} OR MORE HEXES FROM ANY CITY.

[unit_hold]
text = HOLD
tooltip = SKIP IT THIS TURN.

[unit_guard]
text = GUARD
tooltip = SKIP IT UNTIL IT'S GIVEN AN ORDER.

[unit_alert]
text = ALERT
tooltip = STAYS PUT AND ATTACKS THE NEAREST ENEMY IN RANGE EACH TURN, UNTIL IT'S
  GIVEN AN ORDER.

[unit_clear_orders]
