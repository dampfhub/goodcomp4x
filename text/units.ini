# Units: their names, the unit and group trays, their orders' buttons and
# tooltips, the abilities, and what the game says as orders are given.
#
# How to edit this file: docs/text.md. In short, each entry is a [tag] the code
# asks for, then `text = ...` and optionally `tooltip = ...` and
# `hover_text = ...`. Keep every {placeholder} the text has: the code fills it in.
# A {key} is the name of the key that does it, from the game's key map; this
# file never spells a key out. Mouse clicks (CLICK, RIGHT-CLICK, RMB, and CTRL
# or SHIFT with one) aren't keys, so they are written out.
#
# A button's entry has its label as its text, and the description its tooltip
# gives (if any) as its tooltip.

# --- Unit names (src/game/mod.rs, unit_role) ---

[unit_melee]
text = MELEE

[unit_pikeman]
text = PIKEMAN

[unit_ranged]
text = RANGED

[unit_cavalry]
text = CAVALRY

[unit_siege]
text = SIEGE

[unit_scout]
text = SCOUT

[unit_armored]
text = ARMORED

[unit_patrol_galley]
text = PATROL GALLEY

[unit_landing_craft]
text = LANDING CRAFT

[unit_bombard_ship]
