# The screen's frame: the status bar along the top (ImGui) or the top bar along
# the bottom (classic), the Debug panel, the ImGui view controls and the
# panels' window titles.
#
# How to edit this file: docs/text.md. In short, each entry is a [tag] the code
# asks for, then `text = ...` and optionally `tooltip = ...` and
# `hover_text = ...`. Keep every {placeholder} the text has: the code fills it in.
# A {key} is the name of the key that does it, from the game's key map; this
# file never spells a key out.
#
# A button's entry has its label as its text, and the description its tooltip
# gives (if any) as its tooltip. Where the tooltip's title isn't the label, a
# *_title entry has the title as its text, and the description as its tooltip.

# --- The status bar / top bar (src/game/ui/panels.rs, src/game/ui/imgui.rs) ---

[status_turn]
text = TURN {turn}

# The supply beside the stockpile: SUPPLY 3/4.
[status_supply]
text = SUPPLY

# Opens the settings menu (its tooltip is [settings_open_title], menus.ini).
[menu_button]
text = MENU

# End Turn names what the turn still waits on; clicking it selects that.
[end_turn_button]
text = END TURN

[end_turn_queues_idle]
text = END TURN · {queues} WAITING

[end_turn_unit_needs_orders]
text = UNIT NEEDS ORDERS

[end_turn_units_need_orders]
text = {units} UNITS NEED ORDERS

[end_turn_choose_production]
text = CHOOSE PRODUCTION

[end_turn_cities_need_production]
text = {cities} CITIES NEED PRODUCTION

# While the turn isn't this side's to plan: the host's seats still open, the
# sides a network game waits on, or the turn playing out.
[end_turn_seats_open]
text = JOIN CODE {code} - {open} TO COME

[end_turn_waiting_for]
text = WAITING FOR {sides}

[end_turn_waiting_for_others]
text = WAITING FOR THE OTHERS

[end_turn_resolving]
text = RESOLVING

[end_turn_playing_out]
text = NOT WHILE THE TURN PLAYS OUT

# End Turn's tooltip: what a click does, and each queue that works nothing
# this turn, with what it waits for.
[end_turn_selects]
text = SELECTS WHAT STILL NEEDS ORDERS.

[end_turn_resolves]
text = RESOLVES EVERYONE'S ORDERS.

[end_turn_idle_queue]
text = {queue}: {waits_for}.

[end_turn_one_queue_idle]
text = 1 QUEUE WORKS NOTHING THIS TURN

[end_turn_queues_idle_caution]
text = {queues} QUEUES WORK NOTHING THIS TURN

# Waiting for the others' plans, End Turn takes this side's back.
[end_turn_take_back]
text = TAKE BACK

[end_turn_take_back_title]
text = TAKE BACK END TURN
tooltip = YOUR ORDERS ARE SENT. TAKE THEM BACK TO CHANGE THEM, THEN END THE TURN
  AGAIN: UNTIL EVERYONE HAS ENDED IT. GIVING AN ORDER TAKES THEM BACK TOO.

# In place of a key, a tooltip's title line says to click.
[click]
text = CLICK

# --- ImGui's view controls (src/game/ui/imgui.rs) ---
# Each view (what's selected: nothing, a city or building, a troop) keeps its
# own panel layout; boxes group panels.

[view_name]
text = VIEW: {view}

[view_default]
text = DEFAULT

[view_city]
text = CITY / BUILDING

[view_troop]
text = TROOP

# The boxes every view shares.
[view_outer]
text = OUTER

[view_edit_view]
text = EDIT VIEW
tooltip = Arranging the {view} view. Click: arrange the boxes every view shares

[view_edit_outer]
text = EDIT OUTER
tooltip = Arranging the boxes every view shares. Click: arrange the {view} view

[view_add_box]
text = + BOX

[view_reset]
text = RESET
tooltip = {key}: Restore this view's Debug placement and docking from Default

# A box's title, and the text at its top.
[view_box]
text = {view} BOX {number}

# --- Window titles (src/game/ui/imgui.rs) ---
# ImGui knows a panel by its title, and keeps where it was put under it: a
# new title starts that panel in its default place.

[window_selection]
text = Selection

[window_queue]
text = Production Queue

[window_debug]
text = Debug

[window_inspect]
text = Inspect

[window_units]
text = Units

[window_settings]
text = Settings

# A panel captured into a window of its own.
[window_city]
text = City {city}

[window_barracks]
text = Barracks {city}

[window_unit]
text = Unit {unit}

[window_group]
text = Group

[window_city_queue]
text = City {city} Queue

[window_barracks_queue]
text = Barracks {city} Queue

