# The menus: the settings menu Escape opens, and its Multiplayer page.
#
# How to edit this file: docs/text.md. In short, each entry is a [tag] the code
# asks for, then `text = ...` and optionally `tooltip = ...` and
# `hover_text = ...`. Keep every {placeholder} the text has: the code fills it in.
# A {key} (or {world_key}, and so on) is the name of the key that does it, from
# the game's key map; this file never spells a key out.
#
# A button's entry has its label as its text, and the description its tooltip
# gives (if any) as its tooltip. Where the tooltip's title isn't the label, a
# *_title entry has the title as its text, and the description as its tooltip.

# --- Settings menu (src/game/ui/settings_menu.rs) ---

[settings_title]
text = SETTINGS

# The status bar's button that opens the menu: its tooltip.
[settings_open_title]
text = SETTINGS
tooltip = GAME OPTIONS.

[settings_city_overlays]
text = CITY OVERLAYS

[settings_city_yields_on]
text = CITY YIELDS: ON

[settings_city_yields_off]
text = CITY YIELDS: OFF

# The yields button's tooltip.
[settings_yields_title]
text = YIELDS
tooltip = TILE YIELDS AND DELIVERY SHARES.

[settings_multiplayer_button]
text = MULTIPLAYER
tooltip = HOST A GAME ON THE NETWORK, OR JOIN ONE.

[settings_close_button]
text = CLOSE

[settings_close_title]
text = CLOSE SETTINGS

[settings_quit_button]
text = QUIT

# Classic steps a slider with < and >; at either end the button is off, and
# its tooltip says why.
[settings_step_at_lowest]
text = ALREADY THE LOWEST: {value}

[settings_step_at_highest]
text = ALREADY THE HIGHEST: {value}

# A setting's button for the value it has: its tooltip says so.
[setting_already]
text = ALREADY {value}

# The notice when a setting changes: its name and its new value.
[setting_changed_notice]
text = {setting}: {value}

# --- Settings (src/game/settings.rs) ---
# Headings: the settings are listed under these, in groups.

[settings_group_turns]
text = TURNS

[settings_group_map]
text = MAP

[settings_group_next_world]
text = NEXT WORLD ({world_key})

# A switch's two values.
[setting_on]
text = ON

[setting_off]
text = OFF

# Each setting: its name in the menu, and what it does as its tooltip.

[setting_turn_playback]
text = INSTANT PLAYBACK
tooltip = PLAY EACH TURN OUT AT ONCE ({key}).

[setting_turn_transition]
text = TURN TRANSITION
tooltip = UNITS GLIDE TO THEIR NEW HEXES AND THE NEW TURN FLASHES AS A TURN
  RESOLVES.

[setting_queue_limit]
text = QUEUE LIMIT
tooltip = THE MOST TURNS A UNIT CAN QUEUE.

[setting_queue_limit_one]
text = 1 TURN

[setting_queue_limit_many]
text = {turns} TURNS

[setting_fog]
text = FOG
tooltip = CLOUDS OR FLAT GREY OVER UNEXPLORED LAND.

[setting_fog_clouds]
text = CLOUDS

[setting_fog_grey]
text = SOLID GREY

[setting_world_ai]
text = AI PLAYERS
tooltip = AI PLAYERS IN THE NEXT WORLD ({world_key}).

[setting_world_ai_by_map]
text = 4-6 BY MAP

[setting_world_start]
text = START WITH
tooltip = START THE NEXT WORLD ({world_key}) WITH A CITY OR A SETTLER.

[setting_world_start_city]
text = CITY

[setting_world_start_settler]
text = SETTLER

[setting_world_animals]
text = ANIMALS
tooltip = ANIMAL DENS IN THE NEXT WORLD ({world_key}): NONE, ONE A SIDE KEEPING UP TO 2 ANIMALS, OR TWO A SIDE KEEPING UP TO 3. A FULL DEN SENDS OUT STRAYS, ONE A SIDE FOR EACH DEN A SIDE.

[setting_world_animals_off]
text = OFF

[setting_world_animals_few]
text = FEW

[setting_world_animals_many]
text = MANY

# --- Multiplayer page (src/game/ui/network_menu.rs) ---
# The team names (BLUE, RED, ...) aren't here yet.

[net_title]
text = MULTIPLAYER

[net_back_button]
text = BACK
tooltip = BACK TO THE SETTINGS.

# Hosting: how many play, and the < and > buttons that change it.
[net_players]
text = PLAYERS
tooltip = HOW MANY PEOPLE PLAY, YOU INCLUDED. THE AI PLAYS THE OTHER SIDES.

[net_players_too_few]
text = A NETWORK GAME NEEDS 2 PLAYERS OR MORE

[net_players_too_many]
text = {players} PLAYERS AT MOST

# The typed fields: each one's name, then what its tooltip says.
[net_field_port]
text = PORT

[net_field_address]
text = HOST ADDRESS

[net_field_code]
text = JOIN CODE

# In place of a key, the field tooltip's title line says to click.
[net_field_typing]
text = CLICK
tooltip = CLICK, THEN TYPE OR PASTE ({paste_key}). {done_key} WHEN DONE.

[net_host_button]
text = HOST GAME
tooltip = STARTS A NEW WORLD FOR THIS MANY PLAYERS AND SHOWS THE JOIN CODE TO
  GIVE THEM. THEY NEED YOUR ADDRESS AND THE PORT OPEN.

[net_join_button]
text = JOIN GAME
tooltip = JOINS THE GAME HOSTED AT THIS ADDRESS (HOST OR HOST:PORT) WITH THE
  CODE IT SHOWS.

# Host and Join are off while a join is under way.
[net_busy]
text = ALREADY JOINING A GAME

# What the page says when Host or Join is pressed with a field not filled in.
[net_bad_port]
text = THE PORT IS A NUMBER FROM 1 TO 65535

[net_no_address]
text = TYPE THE HOST'S ADDRESS FIRST

[net_no_code]
text = TYPE THE JOIN CODE THE HOST SHOWS

# In a network game: whose side this machine plays.
[net_hosting_as]
text = HOSTING AS

[net_playing_as]
text = PLAYING AS

# The host's sides no one has joined yet, listed.
[net_seats_open]
text = SEATS OPEN: {seats}

# Hosting: what the others need to join, each with a COPY button.
[net_host_code]
text = JOIN CODE

[net_host_address]
text = YOUR ADDRESS

[net_host_no_address]
text = NO LOCAL NETWORK ADDRESS FOUND - PORT {port}

[net_host_internet]
text = PLAYERS OVER THE INTERNET NEED YOUR PUBLIC IP, AND PORT {port} FORWARDED
  TO THIS PC

[net_copy_button]
text = COPY

[net_copy_code_title]
text = COPY JOIN CODE
tooltip = PUTS THE JOIN CODE ON THE CLIPBOARD, TO SEND TO THE OTHER PLAYERS.

[net_copy_address_title]
text = COPY ADDRESS
tooltip = PUTS YOUR ADDRESS ON THE LOCAL NETWORK ON THE CLIPBOARD. PLAYERS OVER
  THE INTERNET NEED YOUR PUBLIC IP INSTEAD.

# Leaving: the host ends the game for everyone; a guest leaves its side to the AI.
[net_leave_button]
text = LEAVE GAME

[net_leave_as_host]
text = ENDS THE GAME FOR EVERYONE AND STARTS A NEW ONE OF YOUR OWN.

[net_leave_as_guest]
text = THE AI PLAYS YOUR SIDE; YOU START A NEW GAME OF YOUR OWN.
