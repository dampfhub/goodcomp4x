# Research: the techs' names, what a locked card says, the research view and
# its queue, and what the game says as research is queued and done.
#
# How to edit this file: docs/text.md. In short, each entry is a [tag] the code
# asks for, then `text = ...` and optionally `tooltip = ...` and
# `hover_text = ...`. Keep every {placeholder} the text has: the code fills it in.
# A {key} is the name of the key that does it, from the game's key map; this
# file never spells a key out.
#
# What each tech costs, needs and unlocks is the tree in src/game/research.rs
# (TECHS); only the names are here.

# --- The techs (src/game/research.rs, TECHS) ---

[tech_i_a]
text = TECH I-A

[tech_i_b]
text = TECH I-B

[tech_i_c]
text = TECH I-C

[tech_ii_a]
text = TECH II-A

[tech_ii_b]
text = TECH II-B

[tech_ii_c]
text = TECH II-C

[tech_ii_d]
text = TECH II-D

[tech_iii_a]
text = TECH III-A

[tech_iii_b]
text = TECH III-B

[tech_iii_c]
text = TECH III-C

# --- Locks (city, Barracks and building cards) ---

# A unit or building its side hasn't researched: the tech it needs.
[research_lock]
text = NEEDS {tech}

# --- Notices (src/game/research.rs) ---

[research_queued]
text = QUEUED {techs}: {cost}

[research_had_already]
text = {tech} RESEARCHED ALREADY

[research_queued_already]
text = {tech} QUEUED ALREADY

# {techs}: the tech taken off and any queued after it that need it.
[research_removed]
text = REMOVED {techs} FROM RESEARCH: {refund}

[research_cleared]
text = CLEARED RESEARCH: {refund}

[research_reordered]
text = RESEARCH REORDERED

# Moving a tech ahead of one it needs, or a plan that does.
[research_needs_first]
text = {tech} NEEDS {needs} FIRST

[research_done]
text = RESEARCHED {tech}: {unlocks}

# F9 in the research view, with nothing it can research now.
[research_debug_nothing]
text = DEBUG: NO RESEARCH THE STOCKPILE PAYS FOR

# --- The top bar (src/game/ui/research.rs, research_spans) ---

# After the supply: the tech researched now and the turns it has left
# (TECH I-A, the clock, 2), or this when nothing is.
[status_research_none]
text = NO RESEARCH

[status_research_waits]
text = {tech} WAITS

# --- The research view (src/game/ui/research.rs) ---

# Opens it, from a city's tray; also its tooltip's title.
[research_button]
text = RESEARCH
tooltip = THE TECH TREE AND THE RESEARCH QUEUE.

[research_open_notice]
text = RESEARCH: CLICK A TECH · {key} OR {back} CLOSES

[research_title]
text = RESEARCH

[research_idle]
text = NOTHING BEING RESEARCHED

[research_working]
text = RESEARCHING {tech} · {turns} LEFT

[research_waits]
text = {tech} WAITS, SHORT OF {short}

[research_how]
text = A TECH QUEUES WITH WHAT IT NEEDS. PAID BEFORE CITY BUILDS.

[research_tier]
text = TIER {tier}

# A tech card's hint, by where it stands.
[research_card_done]
text = RESEARCHED

[research_card_waits]
text = WAITS

[research_card_left]
text = {turns} LEFT

[research_card_queued]
text = QUEUED {place}

# A tech card's tooltip: the click that queues it.
[research_card_key]
text = CLICK

# Under the cards: the techs it needs that aren't researched.
[research_needs]
text = NEEDS {techs}

# The tooltip: what it unlocks and needs, and what clicking queues first.
[research_unlocks]
text = UNLOCKS {unlocks}.

[research_needs_all]
text = NEEDS {techs}.

[research_queues_first]
text = QUEUES {techs} FIRST

# --- The research queue (src/game/ui/research.rs, research_queue_panel) ---

[research_queue_title]
text = RESEARCH QUEUE: DRAG TO REORDER

[research_row_short]
text = WAITS, SHORT OF {short}

# A row's X.
[research_remove]
text = REMOVE
tooltip = TAKES IT OFF, AND ANY TECH THAT NEEDS IT. REFUNDED IF PAID.
