# The checks AGENTS.md calls "done", enforced for every contributor and every agent.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review too, so a draft marked ready is checked and merged.
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge job below starts a run on main this way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build.rs compiles shaders/ with glslc from PATH.
      - name: Install glslc
        run: sudo apt-get update && sudo apt-get install -y glslc
      # A pinned Rust, so a new stable's lints can't turn main red with no code
      # change. Moving to a newer Rust is its own PR: change the version here
      # and fix what its clippy reports. RUSTUP_TOOLCHAIN makes the later steps
      # use it.
      - name: Install Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt
          echo "RUSTUP_TOOLCHAIN=1.100.0" >> "$GITHUB_ENV"
      - run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install glslc
        run: sudo apt-get update && sudo apt-get install -y glslc
      # The oldest Rust supported: rust-version in Cargo.toml.
      - name: Install Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustc --version
      - run: cargo check --locked --all-targets

  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/board/board.mjs selftest
      - run: node tools/commit-msg-lint.mjs --self-test
      - name: Lint this PR's commit messages
        if: github.event_name == 'pull_request'
        run: node tools/commit-msg-lint.mjs --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  # Merges a pull request as soon as every check above passes. Drafts are
  # left alone, which is the way to keep a PR open. The merge uses
  # GITHUB_TOKEN, and pushes made with it start no workflows, so this then
  # starts CI on main itself (workflow_dispatch is the exception to that rule).
  # A merge made with GITHUB_TOKEN also leaves the issues the PR links open
  # (its `Closes #N` lines), so this closes them itself.
  merge:
    needs: [rust, msrv, tools]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # --match-head-commit refuses to merge if a commit landed after the
      # one these checks ran on; that push runs the checks again.
      # --delete-branch removes the merged head branch.
      - run: >-
          gh pr merge "${{ github.event.pull_request.number }}" --merge
          --match-head-commit "${{ github.event.pull_request.head.sha }}"
          --delete-branch
      - name: Close the issues this PR closes
        run: |
          pr="${{ github.event.pull_request.number }}"
          for issue in $(gh pr view "$pr" --json closingIssuesReferences --jq '.closingIssuesReferences[].number'); do
            gh issue close "$issue" --reason completed --comment "Closed by #$pr." || true
          done
      - run: gh workflow run ci.yml --ref main
