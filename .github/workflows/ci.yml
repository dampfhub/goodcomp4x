# The checks AGENTS.md calls "done", enforced for every contributor and every agent.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review too, so a draft marked ready is checked and merged.
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge job below starts a run on main this way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # build.rs compiles shaders/ with glslc from PATH.
      - name: Install glslc
        run: sudo apt-get update && sudo apt-get install -y glslc
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install glslc
        run: sudo apt-get update && sudo apt-get install -y glslc
      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.92
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo check --locked --all-targets

  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node tools/board/board.mjs selftest
      - run: node tools/commit-msg-lint.mjs --self-test
      - name: Lint this PR's commit messages
        if: github.event_name == 'pull_request'
        run: node tools/commit-msg-lint.mjs --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  # Merges a pull request as soon as every check above passes. Drafts are
  # left alone, which is the way to keep a PR open. The merge uses
  # GITHUB_TOKEN, and pushes made with it start no workflows, so this then
  # starts CI on main itself (workflow_dispatch is the exception to that rule).
  # A merge made with GITHUB_TOKEN also leaves the issues the PR links open
  # (its `Closes #N` lines), so this closes them itself.
  merge:
    needs: [rust, msrv, tools]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # --match-head-commit refuses to merge if a commit landed after the
      # one these checks ran on; that push runs the checks again.
      # --delete-branch removes the merged head branch.
      - run: >-
          gh pr merge "${{ github.event.pull_request.number }}" --merge
          --match-head-commit "${{ github.event.pull_request.head.sha }}"
          --delete-branch
      - name: Close the issues this PR closes
        run: |
          pr="${{ github.event.pull_request.number }}"
          for issue in $(gh pr view "$pr" --json closingIssuesReferences --jq '.closingIssuesReferences[].number'); do
            gh issue close "$issue" --reason completed --comment "Closed by #$pr." || true
          done
      - run: gh workflow run ci.yml --ref main
