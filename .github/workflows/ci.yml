# The checks AGENTS.md calls "done", enforced for every contributor and every agent.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review too, so a draft marked ready is checked and merged.
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge job below starts a run on main this way.
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # build.rs compiles shaders/ with glslc from PATH.
      - name: Install glslc
        run: sudo apt-get update && sudo apt-get install -y glslc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install glslc
        run: sudo apt-get update && sudo apt-get install -y glslc
      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/board/board.mjs selftest
      - run: node tools/commit-msg-lint.mjs --self-test
      - name: Lint this PR's commit messages
        if: github.event_name == 'pull_request'
        run: node tools/commit-msg-lint.mjs --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  # Merges a pull request as soon as every check above passes. Drafts are
  # left alone, which is the way to keep a PR open. The merge uses
  # GITHUB_TOKEN, and pushes made with it start no workflows, so this then
  # starts CI on main itself (workflow_dispatch is the exception to that rule).
  merge:
    needs: [rust, msrv, tools]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # --match-head-commit refuses to merge if a commit landed after the
      # one these checks ran on; that push runs the checks again.
      - run: >-
          gh pr merge "${{ github.event.pull_request.number }}" --merge
          --match-head-commit "${{ github.event.pull_request.head.sha }}"
      - run: gh workflow run ci.yml --ref main
