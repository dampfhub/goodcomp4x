[package]
name = "vulkan_engine"
version = "0.1.0"
edition = "2024"
# The oldest Rust that builds this crate and its dependencies (epaint_default_fonts needs 1.92).
rust-version = "1.92"

[dependencies]
anyhow = "1.0.104"
ash = "0.38"
ash-window = "0.13"
env_logger = "0.11.11"
fontdue = "0.9"
glam = "0.33.8"
imgui = { version = "0.12", features = ["docking"] }
imgui-winit-support = "0.13"
imgui-rs-vulkan-renderer = "1.16"
log = "0.4.34"
png = "0.18.1"
rand = "0.10.3"
raw-window-handle = "0.6"
winit = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
spake2 = "0.4.0"
chacha20poly1305 = "0.10"
hkdf = "0.13"
sha2 = "0.10"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

# The system clipboard (`src/clipboard.rs`): already in the lock through winit.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
